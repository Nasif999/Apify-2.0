<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apify — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#faf7f0;--panel:#fff;--fg:#1a1a1a;--muted:#6b6b6b;--accent:#ff4d4d;--line:#1a1a1a;--ok:#1a1a1a;
    --wobbly:255px 15px 225px 15px/15px 225px 15px 255px;--wobblyMd:225px 15px 220px 15px/15px 220px 15px 225px;
    --shadow:4px 4px 0px 0px var(--line);--shadowLg:8px 8px 0px 0px var(--line);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 'Patrick Hand',cursive;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(#e2ddd0 1px, transparent 1px);background-size:22px 22px}
  header{padding:16px 24px;display:flex;align-items:center;gap:12px}
  .logo{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:50% / 45% 55% 45% 55%;padding:8px 20px;font:700 16px 'Kalam',cursive;transform:rotate(-2deg)}
  header .tag{font-size:12px;color:var(--muted);border:2px solid var(--line);border-radius:var(--wobbly);padding:2px 10px}
  main{max-width:960px;margin:0 auto;padding:24px}
  .card{background:var(--panel);border:2px solid var(--line);border-radius:var(--wobblyMd);padding:20px;margin-bottom:20px;box-shadow:var(--shadow);transform:rotate(-.5deg)}
  h2{font:700 18px 'Kalam',cursive;margin:0 0 14px}
  label{display:block;font-size:14px;color:var(--muted);margin:12px 0 5px;font-weight:500}
  input,textarea{width:100%;background:#fff;border:2px solid var(--line);border-radius:var(--wobbly);color:var(--fg);padding:9px 12px;font:15px 'Patrick Hand',cursive}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,77,77,.2)}
  textarea{min-height:120px;resize:vertical}
  button{background:#fff;border:3px solid var(--line);color:var(--fg);padding:9px 18px;border-radius:var(--wobbly);font:15px 'Patrick Hand',cursive;font-weight:700;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s}
  button:hover{background:var(--accent);color:#fff;box-shadow:2px 2px 0px 0px var(--line);transform:translate(2px,2px)}
  button:active{box-shadow:none;transform:translate(4px,4px)}
  button.ghost{background:var(--panel);border:2px dashed var(--line);color:var(--fg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  a.auto{display:block;text-decoration:none;color:inherit;background:var(--panel);border:2px solid var(--line);border-radius:var(--wobblyMd);padding:16px;box-shadow:3px 3px 0px 0px rgba(45,45,45,.15);transition:transform .1s}
  .grid a.auto:nth-child(odd){transform:rotate(-1deg)}
  .grid a.auto:nth-child(even){transform:rotate(1deg)}
  a.auto:hover{transform:rotate(0deg) translate(-2px,-2px);box-shadow:var(--shadow)}
  .auto .name{font:700 16px 'Kalam',cursive;margin-bottom:7px}
  .auto .meta{color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
  .price{color:var(--accent);font-weight:700}
  .key{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:30px}
  .msg{font-size:13px;margin-top:8px}
  .msg.err{color:var(--accent)}.msg.ok{color:var(--ok)}
  .auto-wrap{position:relative}
  .auto-wrap .pick{position:absolute;top:14px;right:14px;width:18px;height:18px;z-index:2}
  .listbar{display:flex;align-items:center;gap:14px;margin:24px 4px 12px}
  .listbar h2{margin:0}
  .listbar label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:0}
  button.danger{background:var(--accent);color:#fff}
  button:disabled{opacity:.4;cursor:not-allowed}

  /* AUTH GATE */
  main{display:none}
  #gate-msg{display:none;text-align:center;color:var(--muted);padding:60px 24px}
  #auth-overlay{display:none;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;background:rgba(26,26,26,.5)}
  .auth-card{position:relative;width:min(380px,92vw);background:var(--bg);border:3px solid var(--line);border-radius:var(--wobblyMd);padding:32px 28px;box-shadow:var(--shadowLg)}
  #auth-close{position:absolute;top:12px;right:14px;background:none;border:none;box-shadow:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:0;font-family:'Kalam',cursive}
  #auth-close:hover{background:none;color:var(--accent);transform:none}
  .auth-card .brand{text-align:center;font:700 20px 'Kalam',cursive;margin-bottom:6px}
  .auth-card .brand span{color:var(--accent)}
  #auth-subtitle{text-align:center;font-size:13px;color:var(--muted);margin:0 0 22px}
  #auth-form input{margin-bottom:12px}
  #auth-error{display:none;color:var(--accent);font-size:12.5px;margin:4px 0 0;font-weight:700}
  #auth-submit{width:100%;margin-top:14px;background:var(--fg);color:#fff}
  #auth-submit:hover{background:var(--accent)}
  .auth-toggle{text-align:center;font-size:12.5px;color:var(--muted);margin:18px 0 0}
  #auth-toggle{color:var(--accent);font-weight:700;text-decoration:none}
  .stash-note{display:none;margin-top:10px;text-align:center;font-size:12.5px;color:var(--accent);font-weight:700}
</style>
</head>
<body>
<header>
  <a href="/index.html" style="text-decoration:none;color:inherit"><span class="logo">Apify</span></a><span class="tag">dashboard</span>
</header>
<main>
  <div class="card">
    <h2>Create an automation</h2>
    <label>Name</label>
    <input id="name" placeholder="e.g. Cox's Bazar hotel search" />
    <div id="recordingField">
      <label>Recording JSON (exported from the extension)</label>
      <textarea id="recording" placeholder='{ "steps": [ ... ], "urlParams": { ... } }'></textarea>
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-weight:400;margin-top:8px">
      <input type="checkbox" id="scanForMissedFields" style="width:auto" />
      Scan for missed fields (uses AI, takes a few extra seconds)
    </label>
    <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
      <button id="create">Create</button>
      <span id="msg" class="msg"></span>
    </div>
  </div>

  <div class="listbar">
    <h2>Your automations</h2>
    <label><input type="checkbox" id="selectAll" /> Select all</label>
    <button class="danger" id="deleteSelected" disabled>Delete selected</button>
    <span id="delmsg" class="msg"></span>
  </div>
  <div id="list" class="grid"></div>
</main>

<div id="gate-msg">Checking your account…</div>

<div id="auth-overlay">
  <div class="auth-card">
    <button id="auth-close" type="button" aria-label="Close">×</button>
    <div class="brand">Apif<span>y</span></div>
    <p id="auth-subtitle">Sign in to open your dashboard</p>
    <form id="auth-form">
      <input id="auth-email" type="email" required placeholder="Email address" />
      <input id="auth-password" type="password" required minlength="6" placeholder="Password" />
      <p id="auth-error"></p>
      <button id="auth-submit" type="submit">Sign In</button>
    </form>
    <p class="stash-note" id="stashNote">Your recording is saved — it'll be waiting after you sign in.</p>
    <p class="auth-toggle">
      <span id="auth-toggle-text">No account?</span>
      <a href="#" id="auth-toggle">Create one</a>
    </p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  const app = initializeApp({
    apiKey: "AIzaSyC1nIXDhMWWwsGmkKbsXR6QX8GIKjZRaDo",
    authDomain: "apify-f44d7.firebaseapp.com",
    projectId: "apify-f44d7",
    storageBucket: "apify-f44d7.firebasestorage.app",
    messagingSenderId: "613416959254",
    appId: "1:613416959254:web:c79a43b65ac279f8246437",
    measurementId: "G-0C48W0J8QT"
  });
  const auth = getAuth(app);

  const FRIENDLY_ERRORS = {
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/user-not-found': 'No account with that email. Try creating one.',
    'auth/wrong-password': 'Wrong password.',
    'auth/invalid-credential': 'Wrong email or password.',
    'auth/email-already-in-use': 'An account with that email already exists.',
    'auth/weak-password': 'Password must be at least 6 characters.',
    'auth/too-many-requests': 'Too many attempts. Try again later.'
  };

  window.apifyAuth = async function (mode, email, password) {
    try {
      if (mode === 'signup') await createUserWithEmailAndPassword(auth, email, password);
      else await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      throw new Error(FRIENDLY_ERRORS[err.code] || err.message);
    }
  };

  // The gate: main stays hidden until Firebase says who this is. A pending
  // recording is already stashed in sessionStorage by then, so signing in
  // (or reloading through the sign-in) never loses it.
  onAuthStateChanged(auth, (user) => {
    const main = document.querySelector('main');
    const gate = document.getElementById('gate-msg');
    const overlay = document.getElementById('auth-overlay');
    window.apifyUser = user || null;
    if (user) {
      overlay.style.display = 'none';
      gate.style.display = 'none';
      main.style.display = 'block';
      if (typeof window.restorePendingRecording === 'function') window.restorePendingRecording();
    } else {
      main.style.display = 'none';
      gate.style.display = 'none';
      overlay.style.display = 'flex';
      document.getElementById('stashNote').style.display =
        sessionStorage.getItem('apify_stashed_recording') ? 'block' : 'none';
    }
  });
</script>

<script>
document.getElementById('gate-msg').style.display = 'block';

(() => {
  const form = document.getElementById('auth-form');
  const emailEl = document.getElementById('auth-email');
  const passEl = document.getElementById('auth-password');
  const errEl = document.getElementById('auth-error');
  const submitBtn = document.getElementById('auth-submit');
  const toggleLink = document.getElementById('auth-toggle');
  const toggleText = document.getElementById('auth-toggle-text');
  const subtitle = document.getElementById('auth-subtitle');
  let mode = 'signin';

  document.getElementById('auth-close').addEventListener('click', () => {
    window.location.href = '/index.html';
  });

  toggleLink.addEventListener('click', (e) => {
    e.preventDefault();
    mode = mode === 'signin' ? 'signup' : 'signin';
    if (mode === 'signup') {
      subtitle.textContent = 'Create your account';
      submitBtn.textContent = 'Create Account';
      toggleText.textContent = 'Already have an account?';
      toggleLink.textContent = 'Sign in';
    } else {
      subtitle.textContent = 'Sign in to open your dashboard';
      submitBtn.textContent = 'Sign In';
      toggleText.textContent = 'No account?';
      toggleLink.textContent = 'Create one';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'signup' ? 'Creating…' : 'Signing in…';
    try {
      if (typeof window.apifyAuth !== 'function') throw new Error('Auth not ready yet — try again in a second.');
      await window.apifyAuth(mode, emailEl.value.trim(), passEl.value);
      // onAuthStateChanged reveals the dashboard and restores the recording.
    } catch (err) {
      errEl.textContent = err.message || 'Something went wrong.';
      errEl.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'signup' ? 'Create Account' : 'Sign In';
    }
  });
})();
</script>

<script>
const $ = (id) => document.getElementById(id);

async function loadList(){
  const res = await fetch('/api/automations');
  const items = await res.json();
  const list = $('list');
  if(!items.length){ list.innerHTML = '<div class="empty">No automations yet — paste a recording above to create one.</div>'; return; }
  list.innerHTML = '';
  for(const a of items){
    const wrap = document.createElement('div');
    wrap.className = 'auto-wrap';
    wrap.innerHTML = `<input type="checkbox" class="pick" data-id="${a.id}" />`;
    const el = document.createElement('a');
    el.className = 'auto';
    el.href = `/automation.html?id=${a.id}`;
    el.innerHTML =
      `<div class="name"></div>
       <div class="key"></div>
       <div class="meta">
         <span><b>${a.fieldCount}</b> fields</span>
         <span class="price">৳${a.price} / run</span>
         <span>${a.runCount} runs</span>
         <span>${a.mode||''}</span>
       </div>`;
    el.querySelector('.name').textContent = a.name;
    el.querySelector('.key').textContent = a.apiKeyMasked;
    wrap.querySelector('.pick').addEventListener('change', updateDeleteButton);
    wrap.appendChild(el);
    list.appendChild(wrap);
  }
  $('selectAll').checked = false;
  updateDeleteButton();
}

function checkboxes(){ return Array.from(document.querySelectorAll('#list .pick')); }

function updateDeleteButton(){
  const any = checkboxes().some(cb => cb.checked);
  $('deleteSelected').disabled = !any;
}

$('selectAll').addEventListener('change', () => {
  checkboxes().forEach(cb => cb.checked = $('selectAll').checked);
  updateDeleteButton();
});

$('deleteSelected').addEventListener('click', async () => {
  const ids = checkboxes().filter(cb => cb.checked).map(cb => cb.getAttribute('data-id'));
  if(!ids.length) return;
  const delmsg = $('delmsg'); delmsg.textContent = ''; delmsg.className = 'msg';
  const results = await Promise.all(ids.map(id => fetch('/api/automations/'+id, { method: 'DELETE' })));
  const failed = results.filter(r => !r.ok).length;
  delmsg.textContent = failed ? `${failed} failed to delete` : 'Deleted ✓';
  delmsg.className = failed ? 'msg err' : 'msg ok';
  loadList();
});

// Applied straight from a DOM message, not chrome.storage — page JS has no
// chrome.* API access. Pure enough to unit test: takes doc+recording, mutates.
function applyPendingRecording(doc, recording){
  doc.getElementById('recording').value = JSON.stringify(recording);
  doc.getElementById('recordingField').style.display = 'none';
  doc.getElementById('name').focus();
}

// The extension clears its copy the moment it hands off, so stash ours before
// anything else -- a signed-out visitor still has to get through the auth gate,
// and that must not cost them the recording they just made.
const KEY_STASH = 'apify_stashed_recording';

window.restorePendingRecording = function(){
  const raw = sessionStorage.getItem(KEY_STASH);
  if (!raw) return;
  try { applyPendingRecording(document, JSON.parse(raw)); }
  catch { sessionStorage.removeItem(KEY_STASH); }
};

window.addEventListener('message', (e) => {
  if (e.source !== window || !e.data || e.data.source !== 'apify-extension') return;
  if (e.data.type !== 'pending-recording') return;
  sessionStorage.setItem(KEY_STASH, JSON.stringify(e.data.recording));
  if (window.apifyUser) window.restorePendingRecording();
  else document.getElementById('stashNote').style.display = 'block';
});

$('create').addEventListener('click', async () => {
  const msg = $('msg'); msg.textContent=''; msg.className='msg';
  let recording;
  try{ recording = JSON.parse($('recording').value); }
  catch(e){ msg.textContent='Recording is not valid JSON.'; msg.className='msg err'; return; }
  const scanning = $('scanForMissedFields').checked;
  // Create runs several sequential AI calls server-side (formspec naming/
  // filtering + optional scan) and can take 30-60s with no other signal --
  // without a visible timer here the button looked dead and got rage-clicked
  // into duplicate automations. Disable + tick so a slow response still reads
  // as "working," not "broken."
  $('create').disabled = true;
  const startedAt = Date.now();
  const tick = () => {
    const s = Math.round((Date.now() - startedAt) / 1000);
    msg.textContent = `Creating… ${s}s${scanning ? ' (scanning for missed fields)' : ''}`;
    msg.className = 'msg';
  };
  tick();
  const timer = setInterval(tick, 1000);
  try{
    const res = await fetch('/api/automations', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name: $('name').value, recording, scanForMissedFields: scanning })
    });
    const data = await res.json();
    if(!res.ok){ msg.textContent = data.error || 'Failed'; msg.className='msg err'; return; }
    msg.textContent = 'Created ✓'; msg.className='msg ok';
    sessionStorage.removeItem(KEY_STASH);
    $('name').value=''; $('recording').value=''; $('scanForMissedFields').checked=false;
    $('recordingField').style.display = '';
    loadList();
  }catch(e){
    msg.textContent = 'Failed: '+e.message; msg.className='msg err';
  }finally{
    clearInterval(timer); $('create').disabled = false;
  }
});

loadList();
</script>
</body>
</html>
