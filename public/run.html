<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apify — Output</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#faf7f0;--panel:#fff;--fg:#1a1a1a;--muted:#6b6b6b;--accent:#ff4d4d;--line:#1a1a1a;--ok:#1a1a1a;
    --wobbly:255px 15px 225px 15px/15px 225px 15px 255px;--wobblyMd:225px 15px 220px 15px/15px 220px 15px 225px;
    --shadow:4px 4px 0px 0px var(--line);--shadowLg:8px 8px 0px 0px var(--line);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 'Patrick Hand',cursive;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(#e2ddd0 1px, transparent 1px);background-size:22px 22px}
  header{padding:16px 24px;border-bottom:3px dashed var(--line);display:flex;align-items:center;gap:12px}
  header a{color:var(--accent);text-decoration:none;font-size:14px}
  header h1{font:700 20px 'Kalam',cursive;margin:0;transform:rotate(-1deg)}
  main{max-width:1080px;margin:0 auto;padding:24px}
  .card{background:var(--panel);border:2px solid var(--line);border-radius:var(--wobblyMd);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .meta{color:var(--muted);font-size:13px;margin-bottom:10px}
  .muted{color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:6px}
  .rcard{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:#fff;border:2px solid var(--line);border-radius:var(--wobblyMd);overflow:hidden;box-shadow:3px 3px 0px 0px rgba(45,45,45,.15);transition:transform .1s,box-shadow .1s}
  .grid .rcard:nth-child(odd){transform:rotate(-1deg)}
  .grid .rcard:nth-child(even){transform:rotate(1deg)}
  .rcard:hover{transform:rotate(0deg) translate(-2px,-2px);box-shadow:var(--shadow)}
  .rcard .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--muted);display:block;border-bottom:2px solid var(--line)}
  .rcard .noThumb{width:100%;aspect-ratio:16/9;background:#e5e0d8;border-bottom:2px solid var(--line)}
  .rcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .rcard .rname{font:700 15px 'Kalam',cursive;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rcard .rsub{color:var(--muted);font-size:12px}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
  .badge{background:#fff9c4;border:2px solid var(--line);color:var(--fg);font-size:11px;padding:3px 9px;border-radius:var(--wobbly);white-space:nowrap}
  .badge.rating{color:#8a5a00;border-color:var(--line)}
  .badge.price{color:#fff;background:var(--accent);border-color:var(--line);font-weight:700}
  .report{margin-top:16px;border-top:3px dashed var(--line);padding-top:14px}
  .report textarea{width:100%;min-height:60px;background:#fff;border:2px solid var(--line);border-radius:var(--wobbly);color:var(--fg);padding:9px 12px;font:15px 'Patrick Hand',cursive;resize:vertical}
  .report button{background:#fff;border:3px solid var(--line);color:var(--fg);padding:8px 16px;border-radius:var(--wobbly);font:14px 'Patrick Hand',cursive;font-weight:700;cursor:pointer;margin-top:8px;box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s}
  .report button:hover{background:var(--accent);color:#fff;box-shadow:2px 2px 0px 0px var(--line);transform:translate(2px,2px)}
  .report button.ghost{background:var(--panel);border:2px dashed var(--line);color:var(--fg);box-shadow:none}
  .report .msg{font-size:13px;margin-top:8px;color:var(--muted)}
  .report .msg.ok{color:var(--ok)}
  .report .msg.err{color:var(--accent)}
  .ghost{background:var(--panel);border:2px dashed var(--line);color:var(--fg);padding:6px 14px;border-radius:var(--wobbly);font:14px 'Patrick Hand',cursive;font-weight:500;cursor:pointer}
  .ghost:hover{border-color:var(--ok);color:var(--ok)}
  pre{font-family:ui-monospace,monospace;font-size:12px;background:#fff;border:2px solid var(--line);border-radius:var(--wobblyMd);padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-all;max-height:340px}
  .summary{background:#fff9c4;border:2px solid var(--line);border-radius:var(--wobblyMd);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);transform:rotate(-.5deg)}
  .summary h3{margin:0 0 8px;font:700 18px 'Kalam',cursive}
  .summary p{margin:0 0 12px;font-size:15px;line-height:1.6;color:var(--fg)}
  .summary .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px 16px}
  .summary .fact dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .summary .fact dd{margin:2px 0 0;font-size:14px;font-weight:700}
</style>
</head>
<body>
<header>
  <a id="back" href="#">← Automation</a>
  <h1>Output</h1>
</header>
<main>
  <div class="card">
    <div class="meta" id="meta">Loading…</div>
    <div id="warnbox" style="display:none;background:#3a2410;border:1px solid #6b4a1a;color:#ffb74d;border-radius:8px;padding:10px 12px;font-size:12px;margin:10px 0">⚠ <span id="warntext"></span></div>
    <div id="srclink" style="margin-bottom:12px"></div>
    <div id="summaryBox" style="display:none"></div>
    <div id="results"></div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="ghost" id="jsonToggle">Show JSON</button>
      <button class="ghost" id="jsonDownload">Download JSON</button>
    </div>
    <pre id="jsonBox" style="display:none;margin-top:10px"></pre>
    <div class="report">
      <button class="ghost" id="reportToggle">Something's wrong?</button>
      <div id="reportForm" style="display:none;margin-top:10px">
        <textarea id="complaint" placeholder="What's missing or wrong? e.g. no price shown, missing amenities"></textarea>
        <div>
          <button id="reportSubmit">Preview fix</button>
        </div>
        <div id="reportMsg" class="msg"></div>
        <div id="fixPreview"></div>
      </div>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const id = q.get('id');
const runId = q.get('runId');
$('back').href = `/automation.html?id=${id}`;

function badges(r){
  const m = r.metrics || {};
  const list = [];
  if(r.rating!=null) list.push(['rating', '★ '+r.rating]);
  if(r.price) list.push(['price', r.price]);
  if(m.views) list.push(['', m.views+' views']);
  if(m.subscribers) list.push(['', m.subscribers+' subscribers']);
  if(m.watching) list.push(['', m.watching+' watching']);
  if(m.duration) list.push(['', m.duration]);
  if(m.publishedAgo) list.push(['', m.publishedAgo]);
  if(m.reviews) list.push(['', m.reviews+' reviews']);
  return list.map(([cls, text]) => {
    const el = document.createElement('span');
    el.className = 'badge '+cls;
    el.textContent = text;
    return el;
  });
}

// Each result carries its own r.type ('card' = thumbnail grid tile, today's
// rendering; 'text' = no thumbnail, no forced link, just name + facts) —
// decided per item by the extractor, so a page mixing real linkable results
// with a url-less fact renders both correctly in the same grid.
function renderCards(box, results){
  if(!results || !results.length){ box.innerHTML = '<div class="muted">No results.</div>'; return; }
  box.className = 'grid';
  box.innerHTML = '';
  for(const r of results){
    if(r.type === 'text'){
      const row = document.createElement(r.url ? 'a' : 'div');
      if(r.url){ row.href = r.url; row.target = '_blank'; row.rel = 'noopener'; }
      row.className = 'rcard';
      row.style.padding = '12px 14px';
      row.innerHTML = `<div class="body"><div class="rname"></div><div class="rsub"></div><div class="badges"></div></div>`;
      row.querySelector('.rname').textContent = r.name || '(unnamed)';
      const sub = row.querySelector('.rsub');
      if(r.subtitle){ sub.textContent = r.subtitle; } else { sub.remove(); }
      const badgeBox = row.querySelector('.badges');
      for(const b of badges(r)) badgeBox.appendChild(b);
      box.appendChild(row);
      continue;
    }
    const card = document.createElement(r.url ? 'a' : 'div');
    if(r.url){ card.href = r.url; card.target = '_blank'; card.rel = 'noopener'; }
    card.className = 'rcard';
    card.innerHTML =
      `${r.image?`<img class="thumb" src="${r.image}" alt="" loading="lazy"/>`:'<div class="noThumb"></div>'}
       <div class="body">
         <div class="rname"></div>
         <div class="rsub"></div>
         <div class="badges"></div>
       </div>`;
    card.querySelector('.rname').textContent = r.name || '(unnamed)';
    const sub = card.querySelector('.rsub');
    if(r.subtitle){ sub.textContent = r.subtitle; } else { sub.remove(); }
    const badgeBox = card.querySelector('.badges');
    for(const b of badges(r)) badgeBox.appendChild(b);
    box.appendChild(card);
  }
}

// A synthesized write-up (headline + prose + key facts) for informational
// content — an actual answer, closer to a Wikipedia intro/infobox than a
// stack of scraped rows. Null for a comparable listing (hotels, videos).
function renderSummary(summary){
  const box = $('summaryBox');
  if(!summary){ box.style.display = 'none'; box.innerHTML = ''; return; }
  box.style.display = 'block';
  const facts = Object.entries(summary.facts || {});
  box.innerHTML =
    `<div class="summary">
      ${summary.headline ? `<h3></h3>` : ''}
      ${summary.text ? `<p></p>` : ''}
      ${facts.length ? '<dl class="facts"></dl>' : ''}
    </div>`;
  if(summary.headline) box.querySelector('h3').textContent = summary.headline;
  if(summary.text) box.querySelector('p').textContent = summary.text;
  if(facts.length){
    const dl = box.querySelector('.facts');
    for(const [k, v] of facts){
      const wrap = document.createElement('div');
      wrap.className = 'fact';
      wrap.innerHTML = '<dt></dt><dd></dd>';
      wrap.querySelector('dt').textContent = k;
      wrap.querySelector('dd').textContent = v;
      dl.appendChild(wrap);
    }
  }
}

function render(run){
  const short = run.outputCount && run.resultCount < run.outputCount
    ? ` — no more results could be found (asked for ${run.outputCount})`
    : '';
  $('meta').textContent = `${run.resultCount} results · ${run.mode} · ${new Date(run.at).toLocaleString()} · ৳${run.price}${short}`;
  if(run.warning){
    $('warnbox').style.display = 'block';
    $('warntext').textContent = run.warning + ' Treat this run\'s output with caution.';
  }
  if(run.finalUrl){
    $('srclink').innerHTML = `<span class="muted">Source: </span><a href="${run.finalUrl}" target="_blank" rel="noopener" style="color:var(--accent);font-size:12px;word-break:break-all">${run.finalUrl}</a>`;
  }
  renderSummary(run.summary);
  renderCards($('results'), run.results);
  $('jsonBox').textContent = JSON.stringify(run.summary ? { summary: run.summary, results: run.results } : run.results, null, 2);
}

$('jsonToggle').addEventListener('click', () => {
  const box = $('jsonBox');
  const showing = box.style.display !== 'none';
  box.style.display = showing ? 'none' : 'block';
  $('jsonToggle').textContent = showing ? 'Show JSON' : 'Hide JSON';
});

$('jsonDownload').addEventListener('click', () => {
  const blob = new Blob([$('jsonBox').textContent || '[]'], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${id || 'output'}-${runId || 'result'}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

let apiKey = null;

fetch(`/api/automations/${id}/runs/${runId}`)
  .then(r => r.ok ? r.json() : Promise.reject(new Error('Not found')))
  .then(render)
  .catch(e => { $('meta').textContent = 'Error: '+e.message; });

fetch(`/api/automations/${id}`)
  .then(r => r.ok ? r.json() : null)
  .then(a => { if(a) apiKey = a.apiKey; })
  .catch(() => {});

$('reportToggle').addEventListener('click', () => {
  const form = $('reportForm');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
});

let lastFix = null;

$('reportSubmit').addEventListener('click', async () => {
  const complaint = $('complaint').value.trim();
  const msg = $('reportMsg'); msg.textContent=''; msg.className='msg';
  $('fixPreview').innerHTML=''; lastFix = null;
  if(!complaint){ msg.textContent = 'Describe what\'s wrong first.'; msg.className='msg err'; return; }
  if(!apiKey){ msg.textContent = 'Still loading — try again in a moment.'; msg.className='msg err'; return; }
  msg.textContent = 'Re-checking with AI…';
  $('reportSubmit').disabled = true;
  try{
    const res = await fetch(`/api/automations/${id}/runs/${runId}/report`, {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Api-Key':apiKey},
      body: JSON.stringify({ complaint })
    });
    const data = await res.json();
    if(!res.ok){ msg.textContent = data.error+(data.detail?(': '+data.detail):''); msg.className='msg err'; return; }
    lastFix = { complaint, results: data.results };
    msg.innerHTML = 'Here\'s the corrected extraction — does this look right? ';
    const yes = document.createElement('button');
    yes.textContent = 'Yes, save this fix';
    yes.onclick = confirmFix;
    msg.appendChild(yes);
    const box = document.createElement('div');
    box.style.marginTop = '10px';
    $('fixPreview').appendChild(box);
    renderCards(box, data.results);
  } catch(e){ msg.textContent = 'Error: '+e.message; msg.className='msg err'; }
  finally{ $('reportSubmit').disabled = false; }
});

async function confirmFix(){
  const msg = $('reportMsg');
  if(!lastFix) return;
  const res = await fetch(`/api/automations/${id}/report-confirm`, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Api-Key':apiKey},
    body: JSON.stringify({ complaint: lastFix.complaint })
  });
  const data = await res.json();
  if(!res.ok){ msg.textContent = data.error; msg.className='msg err'; return; }
  msg.textContent = 'Saved — every future run of this automation now applies this fix.';
  msg.className = 'msg ok';
}
</script>
</body>
</html>
