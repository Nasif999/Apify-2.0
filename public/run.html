<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apify — Output</title>
<style>
  :root{--bg:#0f1115;--panel:#151924;--fg:#e7e9ee;--muted:#9aa3b2;--accent:#5b8cff;--line:#232733;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  header a{color:var(--muted);text-decoration:none;font-size:13px}
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.03em}
  main{max-width:1080px;margin:0 auto;padding:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  .meta{color:var(--muted);font-size:12px;margin-bottom:10px}
  .muted{color:var(--muted);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:6px}
  .rcard{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:#0b0d12;border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .12s ease,border-color .12s ease}
  .rcard:hover{border-color:#3c4664;transform:translateY(-2px)}
  .rcard .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#171b24;display:block}
  .rcard .noThumb{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#171b24,#1d2230)}
  .rcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .rcard .rname{font-weight:600;font-size:14px;line-height:1.4;letter-spacing:-.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rcard .rsub{color:var(--muted);font-size:12px}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
  .badge{background:#1b2130;border:1px solid var(--line);color:var(--muted);font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .badge.rating{color:#ffc94d;border-color:#4a3a17}
  .badge.price{color:var(--accent);border-color:#2a3a66;font-weight:700}
  .report{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .report textarea{width:100%;min-height:60px;background:#0b0d12;border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:9px 10px;font:13px/1.4 system-ui,sans-serif;resize:vertical}
  .report button{background:var(--accent);border:0;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
  .report button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  .report .msg{font-size:12px;margin-top:8px;color:var(--muted)}
  .report .msg.ok{color:#33d17a}
  .report .msg.err{color:#ff5b6e}
</style>
</head>
<body>
<header>
  <a id="back" href="#">← Automation</a>
  <h1>Output</h1>
</header>
<main>
  <div class="card">
    <div class="meta" id="meta">Loading…</div>
    <div id="warnbox" style="display:none;background:#3a2410;border:1px solid #6b4a1a;color:#ffb74d;border-radius:8px;padding:10px 12px;font-size:12px;margin:10px 0">⚠ <span id="warntext"></span></div>
    <div id="srclink" style="margin-bottom:12px"></div>
    <div id="results"></div>
    <div class="report">
      <button class="ghost" id="reportToggle">Something's wrong?</button>
      <div id="reportForm" style="display:none;margin-top:10px">
        <textarea id="complaint" placeholder="What's missing or wrong? e.g. no price shown, missing amenities"></textarea>
        <div>
          <button id="reportSubmit">Preview fix</button>
        </div>
        <div id="reportMsg" class="msg"></div>
        <div id="fixPreview"></div>
      </div>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const id = q.get('id');
const runId = q.get('runId');
$('back').href = `/automation.html?id=${id}`;

function badges(r){
  const m = r.metrics || {};
  const list = [];
  if(r.rating!=null) list.push(['rating', '★ '+r.rating]);
  if(r.price) list.push(['price', r.price]);
  if(m.views) list.push(['', m.views+' views']);
  if(m.subscribers) list.push(['', m.subscribers+' subscribers']);
  if(m.watching) list.push(['', m.watching+' watching']);
  if(m.duration) list.push(['', m.duration]);
  if(m.publishedAgo) list.push(['', m.publishedAgo]);
  if(m.reviews) list.push(['', m.reviews+' reviews']);
  return list.map(([cls, text]) => {
    const el = document.createElement('span');
    el.className = 'badge '+cls;
    el.textContent = text;
    return el;
  });
}

function renderCards(box, results){
  if(!results || !results.length){ box.innerHTML = '<div class="muted">No results.</div>'; return; }
  box.className = 'grid';
  box.innerHTML = '';
  for(const r of results){
    const card = document.createElement(r.url ? 'a' : 'div');
    if(r.url){ card.href = r.url; card.target = '_blank'; card.rel = 'noopener'; }
    card.className = 'rcard';
    card.innerHTML =
      `${r.image?`<img class="thumb" src="${r.image}" alt="" loading="lazy"/>`:'<div class="noThumb"></div>'}
       <div class="body">
         <div class="rname"></div>
         <div class="rsub"></div>
         <div class="badges"></div>
       </div>`;
    card.querySelector('.rname').textContent = r.name || '(unnamed)';
    const sub = card.querySelector('.rsub');
    if(r.subtitle){ sub.textContent = r.subtitle; } else { sub.remove(); }
    const badgeBox = card.querySelector('.badges');
    for(const b of badges(r)) badgeBox.appendChild(b);
    box.appendChild(card);
  }
}

function render(run){
  const short = run.outputCount && run.resultCount < run.outputCount
    ? ` — no more results could be found (asked for ${run.outputCount})`
    : '';
  $('meta').textContent = `${run.resultCount} results · ${run.mode} · ${new Date(run.at).toLocaleString()} · ৳${run.price}${short}`;
  if(run.warning){
    $('warnbox').style.display = 'block';
    $('warntext').textContent = run.warning + ' Treat this run\'s output with caution.';
  }
  if(run.finalUrl){
    $('srclink').innerHTML = `<span class="muted">Source: </span><a href="${run.finalUrl}" target="_blank" rel="noopener" style="color:var(--accent);font-size:12px;word-break:break-all">${run.finalUrl}</a>`;
  }
  renderCards($('results'), run.results);
}

let apiKey = null;

fetch(`/api/automations/${id}/runs/${runId}`)
  .then(r => r.ok ? r.json() : Promise.reject(new Error('Not found')))
  .then(render)
  .catch(e => { $('meta').textContent = 'Error: '+e.message; });

fetch(`/api/automations/${id}`)
  .then(r => r.ok ? r.json() : null)
  .then(a => { if(a) apiKey = a.apiKey; })
  .catch(() => {});

$('reportToggle').addEventListener('click', () => {
  const form = $('reportForm');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
});

let lastFix = null;

$('reportSubmit').addEventListener('click', async () => {
  const complaint = $('complaint').value.trim();
  const msg = $('reportMsg'); msg.textContent=''; msg.className='msg';
  $('fixPreview').innerHTML=''; lastFix = null;
  if(!complaint){ msg.textContent = 'Describe what\'s wrong first.'; msg.className='msg err'; return; }
  if(!apiKey){ msg.textContent = 'Still loading — try again in a moment.'; msg.className='msg err'; return; }
  msg.textContent = 'Re-checking with AI…';
  $('reportSubmit').disabled = true;
  try{
    const res = await fetch(`/api/automations/${id}/runs/${runId}/report`, {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Api-Key':apiKey},
      body: JSON.stringify({ complaint })
    });
    const data = await res.json();
    if(!res.ok){ msg.textContent = data.error+(data.detail?(': '+data.detail):''); msg.className='msg err'; return; }
    lastFix = { complaint, results: data.results };
    msg.innerHTML = 'Here\'s the corrected extraction — does this look right? ';
    const yes = document.createElement('button');
    yes.textContent = 'Yes, save this fix';
    yes.onclick = confirmFix;
    msg.appendChild(yes);
    const box = document.createElement('div');
    box.style.marginTop = '10px';
    $('fixPreview').appendChild(box);
    renderCards(box, data.results);
  } catch(e){ msg.textContent = 'Error: '+e.message; msg.className='msg err'; }
  finally{ $('reportSubmit').disabled = false; }
});

async function confirmFix(){
  const msg = $('reportMsg');
  if(!lastFix) return;
  const res = await fetch(`/api/automations/${id}/report-confirm`, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Api-Key':apiKey},
    body: JSON.stringify({ complaint: lastFix.complaint })
  });
  const data = await res.json();
  if(!res.ok){ msg.textContent = data.error; msg.className='msg err'; return; }
  msg.textContent = 'Saved — every future run of this automation now applies this fix.';
  msg.className = 'msg ok';
}
</script>
</body>
</html>
