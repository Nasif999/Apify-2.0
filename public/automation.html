<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apify — Automation</title>
<style>
  :root{--bg:#0f1115;--panel:#151924;--fg:#e7e9ee;--muted:#9aa3b2;--accent:#5b8cff;--line:#232733;--ok:#33d17a;--danger:#ff5b6e;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  header a{color:var(--muted);text-decoration:none;font-size:13px}
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.03em}
  main{max-width:960px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
  h2{font-size:15px;margin:0 0 14px;font-weight:600;letter-spacing:-.01em}
  label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px;font-weight:500}
  input,select{width:100%;background:#0b0d12;border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:8px 10px;font:13px/1.4 ui-monospace,monospace}
  button{background:var(--accent);border:0;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;width:100%}
  button:disabled{opacity:.5;cursor:not-allowed}
  .price{color:var(--accent);font-weight:700;font-size:15px}
  .bar{height:6px;border-radius:6px;background:#0b0d12;overflow:hidden;margin:14px 0;display:none}
  .bar.on{display:block}
  .bar i{display:block;height:100%;width:40%;background:var(--accent);animation:slide 1.1s infinite ease-in-out}
  @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
  .result{display:flex;gap:12px;padding:10px 8px;border-radius:10px;text-decoration:none;color:inherit;transition:background .12s}
  .result:hover{background:#0b0d12}
  .result img{width:120px;height:90px;object-fit:cover;border-radius:8px;background:#0b0d12;flex:none}
  .result .noThumb{width:120px;height:90px;border-radius:8px;flex:none;background:linear-gradient(135deg,#0b0d12,#171b24)}
  .result .rbody{min-width:0}
  .result .rname{font-weight:600;font-size:14px;line-height:1.4;letter-spacing:-.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .result .rsub{color:var(--muted);font-size:12px;margin-top:2px}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .badge{background:#0b0d12;border:1px solid var(--line);color:var(--muted);font-size:10.5px;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .badge.rating{color:#ffc94d;border-color:#4a3a17}
  .badge.price{color:var(--accent);border-color:#2a3a66;font-weight:700}
  .muted{color:var(--muted);font-size:12px}
  code,pre{font-family:ui-monospace,monospace;font-size:12px}
  pre{background:#0b0d12;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-all}
  .krow{display:flex;gap:8px;align-items:center;margin-top:6px}
  .outlink{margin-top:12px;font-size:13px}
</style>
</head>
<body>
<header>
  <a href="/dashboard.html">← Dashboard</a>
  <h1 id="title">Automation</h1>
</header>
<main>
  <section class="card">
    <h2>Inputs</h2>
    <div id="scanWarnBox" style="display:none;background:#3a2410;border:1px solid #6b4a1a;color:#ffb74d;border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:12px">⚠ AI scan found <span id="scanWarnText"></span> possibly-missed field(s). Consider re-recording to include them.</div>
    <div id="form"></div>
    <label>Number of results</label>
    <select id="outputCount">
      <option>5</option><option selected>10</option><option>20</option><option>50</option>
    </select>
    <div style="margin:16px 0 6px" class="price" id="price"></div>
    <button id="run">Run automation</button>
    <div class="bar" id="bar"><i></i></div>
    <div id="runmsg" class="muted"></div>
  </section>

  <section class="card">
    <h2>Output</h2>
    <div id="warnbox" style="display:none;background:#3a2410;border:1px solid #6b4a1a;color:#ffb74d;border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:12px">⚠ <span id="warntext"></span></div>
    <div id="output"><div class="muted">Run the automation to see results.</div></div>
    <div class="outlink" id="outlink"></div>
  </section>

  <section class="card" style="grid-column:1/-1">
    <h2>REST API</h2>
    <div class="muted">Trigger this automation from any app with its API key.</div>
    <div class="krow"><span class="muted">Key:</span> <code id="maskedKey"></code>
      <button class="ghost" id="copyKey" style="width:auto;background:transparent;border:1px solid var(--line);color:var(--fg);padding:4px 10px;font-size:12px">Copy</button></div>
    <pre id="curl"></pre>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const id = new URLSearchParams(location.search).get('id');
let auto = null;

function fieldRow(f){
  const wrap = document.createElement('div');
  if(f.type === 'tickmark'){
    wrap.innerHTML = `<label style="display:flex;align-items:center;gap:6px"><input type="checkbox" data-key="${f.key}" data-tickmark="true" style="width:auto" /></label>`;
    wrap.querySelector('label').append(` ${f.name}`);
    wrap.querySelector('input').checked = !!f.value;
    return wrap;
  }
  if(f.type === 'compound' && Array.isArray(f.parts)){
    // One labeled box per position; rejoined by data-compound-key/index in
    // collectValues using the exact recorded delimiter (pure position-swap).
    const group = document.createElement('div');
    const heading = document.createElement('div');
    heading.className = 'muted'; heading.style.margin = '2px 0 4px'; heading.textContent = f.name;
    group.appendChild(heading);
    f.parts.forEach((p, i) => {
      const row = document.createElement('div');
      row.innerHTML = `<label></label><input data-compound-key="${f.key}" data-compound-index="${i}" data-delim="${f.delimiter}" />`;
      row.querySelector('label').textContent = p.label;
      row.querySelector('input').value = p.value == null ? '' : p.value;
      group.appendChild(row);
    });
    return group;
  }
  const isArr = Array.isArray(f.value);
  const val = isArr ? f.value.join(', ') : (f.value == null ? '' : f.value);
  wrap.innerHTML = `<label></label><input data-key="${f.key}" data-arr="${isArr}" />`;
  wrap.querySelector('label').textContent = `${f.name}  (${f.type})`;
  wrap.querySelector('input').value = val;
  return wrap;
}

function collectValues(){
  const values = {};
  const compound = {}; // key -> { delim, parts: {index: value} }
  document.querySelectorAll('#form input').forEach(inp => {
    const compoundKey = inp.getAttribute('data-compound-key');
    if(compoundKey != null){
      const idx = Number(inp.getAttribute('data-compound-index'));
      (compound[compoundKey] = compound[compoundKey] || { delim: inp.getAttribute('data-delim'), parts: {} }).parts[idx] = inp.value;
      return;
    }
    const key = inp.getAttribute('data-key');
    if(inp.getAttribute('data-tickmark') === 'true'){ values[key] = inp.checked; return; }
    const isArr = inp.getAttribute('data-arr') === 'true';
    const raw = inp.value;
    values[key] = isArr ? raw.split(',').map(s=>s.trim()).filter(Boolean) : raw;
  });
  // Rejoin each compound field's parts, in position order, with its delimiter.
  for(const [key, {delim, parts}] of Object.entries(compound)){
    const ordered = Object.keys(parts).map(Number).sort((a,b)=>a-b).map(i => parts[i]);
    values[key] = ordered.join(delim);
  }
  return values;
}

function badges(r){
  const m = r.metrics || {};
  const list = [];
  if(r.rating!=null) list.push(['rating', '★ '+r.rating]);
  if(r.price) list.push(['price', r.price]);
  if(m.views) list.push(['', m.views+' views']);
  if(m.subscribers) list.push(['', m.subscribers+' subscribers']);
  if(m.watching) list.push(['', m.watching+' watching']);
  if(m.duration) list.push(['', m.duration]);
  if(m.publishedAgo) list.push(['', m.publishedAgo]);
  if(m.reviews) list.push(['', m.reviews+' reviews']);
  return list.map(([cls, text]) => {
    const el = document.createElement('span');
    el.className = 'badge '+cls;
    el.textContent = text;
    return el;
  });
}

function renderResults(results){
  const out = $('output');
  if(!results || !results.length){ out.innerHTML = '<div class="muted">No results returned.</div>'; return; }
  out.innerHTML = '';
  for(const r of results){
    const row = document.createElement(r.url ? 'a' : 'div');
    if(r.url){ row.href = r.url; row.target = '_blank'; row.rel = 'noopener'; }
    row.className = 'result';
    row.innerHTML =
      `${r.image?`<img src="${r.image}" alt=""/>`:'<div class="noThumb"></div>'}
       <div class="rbody">
         <div class="rname"></div>
         <div class="rsub"></div>
         <div class="badges"></div>
       </div>`;
    row.querySelector('.rname').textContent = r.name || '(unnamed)';
    const sub = row.querySelector('.rsub');
    if(r.subtitle){ sub.textContent = r.subtitle; } else { sub.remove(); }
    const badgeBox = row.querySelector('.badges');
    for(const b of badges(r)) badgeBox.appendChild(b);
    out.appendChild(row);
  }
}

async function refreshPrice(){
  const n = Number($('outputCount').value);
  const res = await fetch(`/api/automations/${id}/quote?outputCount=${n}`);
  if(!res.ok) return;
  const q = await res.json();
  $('price').textContent = `৳${q.price} / run`;
  $('curl').textContent =
`curl -X POST ${location.origin}/api/automations/${id}/run \\
  -H "X-Api-Key: YOUR_API_KEY" \\
  -H "Content-Type: application/json" \\
  -d '{"values": {}, "outputCount": ${n}}'`;
}

async function load(){
  const res = await fetch('/api/automations/'+id);
  auto = await res.json();
  if(!res.ok){ $('title').textContent='Not found'; return; }
  $('title').textContent = auto.name;
  $('price').textContent = `৳${auto.price} / run`;
  const form = $('form'); form.innerHTML='';
  (auto.formspec.fields||[]).forEach(f => form.appendChild(fieldRow(f)));
  if(auto.scanWarnings && auto.scanWarnings.length){
    $('scanWarnText').textContent = auto.scanWarnings.map(w => `${w.label} (${w.fieldType})`).join(', ');
    $('scanWarnBox').style.display = 'block';
  } else {
    $('scanWarnBox').style.display = 'none';
  }
  $('maskedKey').textContent = auto.apiKeyMasked;
  await refreshPrice();
}

$('outputCount').addEventListener('change', refreshPrice);

$('copyKey').addEventListener('click', () => navigator.clipboard.writeText(auto.apiKey));

const TYPICAL_RUN_SECONDS = 30;

$('run').addEventListener('click', async () => {
  $('run').disabled = true; $('bar').classList.add('on'); $('outlink').textContent='';
  const startedAt = Date.now();
  const tick = () => {
    const s = Math.round((Date.now() - startedAt) / 1000);
    $('runmsg').textContent = s <= TYPICAL_RUN_SECONDS
      ? `Running headless browser… ${s}s (usually ~${TYPICAL_RUN_SECONDS}s)`
      : `Running headless browser… ${s}s (taking longer than usual, still working)`;
  };
  tick();
  const timer = setInterval(tick, 1000);
  try{
    const requested = Number($('outputCount').value);
    const res = await fetch('/api/automations/'+id+'/run', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Api-Key':auto.apiKey},
      body: JSON.stringify({ values: collectValues(), outputCount: requested })
    });
    const data = await res.json();
    if(!res.ok){ $('runmsg').textContent = data.error+(data.detail?(': '+data.detail):''); }
    else{
      const short = data.resultCount < requested
        ? ` — no more results could be found (asked for ${requested})`
        : '';
      $('runmsg').textContent = `Done — ${data.resultCount} results · ৳${data.price} · mode: ${data.mode}${short}`;
      if(data.warning){
        $('warnbox').style.display = 'block';
        $('warntext').textContent = data.warning + ' Treat this run\'s output with caution.';
      } else {
        $('warnbox').style.display = 'none';
      }
      renderResults(data.results);
      $('outlink').innerHTML = `Output URL: <a href="${data.outputUrl}" target="_blank">${data.outputUrl}</a>`;
    }
  }catch(e){ $('runmsg').textContent = 'Error: '+e.message; }
  finally{ clearInterval(timer); $('run').disabled=false; $('bar').classList.remove('on'); }
});

load();
</script>
</body>
</html>
