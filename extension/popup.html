<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#faf7f0;--panel:#fff;--fg:#1a1a1a;--muted:#6b6b6b;--accent:#ff4d4d;--line:#1a1a1a;--ok:#2e9e5b;
      --wobbly:255px 15px 225px 15px/15px 225px 15px 255px;--wobblyMd:225px 15px 220px 15px/15px 220px 15px 225px;
      --shadow:3px 3px 0px 0px var(--line);--shadowLg:5px 5px 0px 0px var(--line);}
    * { box-sizing: border-box; }
    body{width:320px;margin:0;font:14px/1.5 'Patrick Hand',cursive;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;
      background-image:radial-gradient(#e2ddd0 1px, transparent 1px);background-size:16px 16px}
    header{padding:12px 14px;border-bottom:2px dashed var(--line);display:flex;align-items:center;gap:8px;background:#fff}
    header .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);border:1.5px solid var(--line);transition:background .2s}
    header .dot.on{background:var(--accent);box-shadow:0 0 6px var(--accent);animation:pulse 1.1s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
    h1{font:700 16px 'Kalam',cursive;margin:0;transform:rotate(-2deg);display:inline-block}
    .status{color:var(--muted);font-size:12px;margin-left:auto;transition:color .2s}
    .dot.on ~ .status{color:var(--accent);font-weight:700}
    .body{padding:12px 14px}
    .row{display:flex;gap:8px;margin-bottom:10px}
    button{flex:1;padding:9px 10px;border:2px solid var(--line);border-radius:var(--wobbly);background:#fff;color:var(--fg);cursor:pointer;font:13.5px 'Patrick Hand',cursive;font-weight:700;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s,background .12s}
    button:hover:not(:disabled){background:var(--bg);box-shadow:1px 1px 0px 0px var(--line);transform:translate(2px,2px)}
    button:active:not(:disabled){box-shadow:none;transform:translate(3px,3px)}
    button.primary{background:var(--fg);border-color:var(--line);color:#fff}
    button.primary:hover:not(:disabled){background:var(--accent)}
    button.stop{background:var(--accent);border-color:var(--line);color:#fff}
    button.stop:hover:not(:disabled){background:var(--fg)}
    button.stop:not(:disabled){animation:wiggle 2s ease-in-out infinite}
    @keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.5deg)}}
    button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none;animation:none}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 14px}
    .stats .cell{background:#fff;border:2px solid var(--line);border-radius:50% / 42% 58% 42% 58%;padding:8px 2px;text-align:center;box-shadow:2px 2px 0px 0px rgba(26,26,26,.15);transition:transform .15s,box-shadow .15s}
    .stats .cell:nth-child(odd){transform:rotate(-1.5deg)}
    .stats .cell:nth-child(even){transform:rotate(1.5deg)}
    .stats .cell:hover{transform:rotate(0) translateY(-2px);box-shadow:3px 4px 0px 0px var(--line)}
    .stats .cell b{display:block;font:700 16px 'Kalam',cursive}
    .stats .cell span{color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.03em}
    .section-label{font:700 11px 'Kalam',cursive;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px;display:flex;align-items:center;gap:6px}
    .section-label:after{content:'';flex:1;border-top:1.5px dashed #d8d2c4}
    .vars{max-height:170px;overflow:auto;border:2px solid var(--line);border-radius:var(--wobblyMd);padding:8px;background:#fff}
    .vars:empty::after{content:"No fields captured yet — hit Record and use the page.";color:var(--muted);font-size:12.5px}
    .var{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dashed #e2ddd0;border-radius:8px;transition:background .12s}
    .var:hover{background:var(--bg)}
    .var:last-child{border-bottom:0}
    .tag{font:10px 'Kalam',cursive;padding:1px 7px;border-radius:9999px;background:#fff0ef;color:var(--accent);border:1.5px solid var(--accent);text-transform:uppercase;letter-spacing:.03em}
    .tag.nested{background:#f0eaff;color:#7a4fd6;border-color:#7a4fd6}
    .vname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .vval{color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    footer{padding:10px 14px;border-top:2px dashed var(--line);background:#fff}
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>Apif<span style="color:var(--accent)">y</span></h1>
    <span class="status" id="status">idle</span>
  </header>
  <div class="body">
    <div class="row">
      <button class="primary" id="start">● Record</button>
      <button class="stop" id="stop" disabled>■ Stop</button>
    </div>
    <div class="stats">
      <div class="cell"><b id="stepCount">0</b><span>Steps</span></div>
      <div class="cell"><b id="varCount">0</b><span>Fields</span></div>
      <div class="cell"><b id="siteCount">0</b><span>Sites</span></div>
      <div class="cell"><b id="paramCount">0</b><span>Params</span></div>
    </div>
    <p class="section-label">Captured fields</p>
    <div class="vars" id="vars"></div>
  </div>
  <footer>
    <div class="row" style="margin:0">
      <button id="copy">Copy JSON</button>
      <button id="export">Export JSON</button>
    </div>
  </footer>
  <script src="lib/recorder.js"></script>
  <script src="popup.js"></script>
</body>
</html>
